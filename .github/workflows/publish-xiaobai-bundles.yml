name: Publish XiaoBai integrated bundles
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful XiaoBai integrated bundles build run ID
        required: true
      source_sha:
        description: Exact head SHA of that reviewed build run
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify build and download the two complete bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['RUN_ID']
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9]+', run_id)
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['name'] == 'XiaoBai integrated bundles'
          assert run['conclusion'] == 'success' and run['head_sha'] == sha
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          subprocess.run(['gh', 'run', 'download', run_id, '--dir', 'artifacts'], check=True)
          PY
      - name: Validate and publish consolidated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          from prepare import HAP_SHA, HAP_VERSION
          expected = HAP_SHA
          version = HAP_VERSION
          tag = f'v{version}'
          files = sorted(Path('artifacts').glob('*/*.zip'))
          assert {p.name for p in files} == {f'quietstart-{version}-macOS-arm64-bundle.zip', f'quietstart-{version}-Windows-x64-bundle.zip'}
          hap = Path(f'quietstart-{version}.hap')
          for path in files:
              with zipfile.ZipFile(path) as archive:
                  names = [n for n in archive.namelist() if n.endswith(f'/quietstart-{version}.hap')]
                  assert len(names) == 1
                  data = archive.read(names[0])
                  assert hashlib.sha256(data).hexdigest() == expected
                  if hap.exists():
                      assert hap.read_bytes() == data
                  else:
                      hap.write_bytes(data)
          files.append(hap)
          checksums = Path('SHA256SUMS.txt')
          checksums.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          exists = subprocess.run(['gh', 'release', 'view', tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
          if not exists:
              subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['GITHUB_SHA'], '--draft', '--prerelease', '--title', f'轻启 {version} · 整合包与独立 HAP', '--notes-file', 'RELEASE.md'], check=True)
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, files), str(checksums), '--clobber'], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease', '--title', f'轻启 {version} · 整合包与独立 HAP', '--notes-file', 'RELEASE.md'], check=True)
          PY
